[project]
name = "incident-resolution-swarm"
version = "0.1.0"
description = "Enterprise IT Support & Incident Resolution Swarm (AEE final hackathon)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "google-genai>=1.0",
    "qdrant-client>=1.10",
    "fastembed>=0.3",
    "groq",
    "openai>=1.0",
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "langfuse>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "moto[s3]>=5.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
ignore = ["SIM117"]
