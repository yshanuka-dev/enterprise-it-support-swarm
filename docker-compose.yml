# Day 1: local Postgres seeded with the provided SQL.
# Files in db/init run once, on first start of an empty volume.
# To re-seed: docker compose down -v && docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    container_name: swarm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ops_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarm} -d ${POSTGRES_DB:-ops_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
