# Model routing. Small/fast models for routine work, larger ones only for hard reasoning.
# Change provider/model here only; no code changes needed. Confirm your provider and budget.
tiers:
  small:
    provider: anthropic
    model: claude-haiku-5-5
    max_output_tokens: 1024
  medium:
    provider: anthropic
    model: claude-sonnet-5-5
    max_output_tokens: 2048
  large:
    provider: anthropic
    model: claude-opus-5-5
    max_output_tokens: 4096

roles:                      # which tier each agent role uses
  triage: small
  cag_match: small
  distillation: small
  memory_writeback: small
  voice: small
  investigator: medium
  resolver: medium
  resolver_critical: large  # only for high/critical severity

limits:
  max_tool_retries: 3       # rubric: max 3 retries, then escalate to a human
  max_hops: 8               # graph backstop against loops
  cag_semantic_threshold: 0.88   # start here, tune on Day 5
  rag_min_score: 0.35            # below this: say 'no runbook found' and escalate; tune on Day 5
  voice_target_latency_s: 2.0
